<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>AIGents Control Room — Industry Reset</title>
<link rel="icon" href="/favicon.ico">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--or:#FF5A00;--or2:#ff7a33;--ink:#0A0A0B;--p:#141518;--p2:#1b1d21;--line:#26292e;--t:#EEEFF1;--m:#A3A8AF;--ok:#2ecc71;--warn:#f5b301;--bad:#ff4d4d;--blue:#4da3ff}
*{box-sizing:border-box}html,body{margin:0;background:var(--ink);color:var(--t);font-family:Barlow,system-ui,sans-serif;font-size:15px}
h1,h2,h3{font-family:'Barlow Condensed',sans-serif;letter-spacing:.02em;margin:0}
.brand{font-family:'Russo One',sans-serif;letter-spacing:.04em}
button,input,select,textarea{font:inherit;color:var(--t)}
input,select,textarea{background:var(--ink);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%}
textarea{min-height:80px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--or)}
label{display:block;font-size:12px;color:var(--m);margin:10px 0 4px;text-transform:uppercase;letter-spacing:.06em}
.btn{background:var(--or);color:#000;border:0;border-radius:8px;padding:9px 14px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--or2)}.btn.g{background:var(--p2);color:var(--t);border:1px solid var(--line)}.btn.g:hover{border-color:var(--or)}
.btn.s{padding:6px 10px;font-size:13px}.btn.d{background:transparent;color:var(--bad);border:1px solid #4a2222}
a{color:var(--or)}
/* layout */
#app{display:none;min-height:100vh}
nav{position:fixed;left:0;top:0;bottom:0;width:220px;background:var(--p);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:4px;overflow:auto}
nav .logo{display:flex;align-items:center;gap:10px;padding:4px 8px 16px;border-bottom:1px solid var(--line);margin-bottom:10px}
nav .logo img{width:34px;height:34px;object-fit:contain}
nav .logo small{display:block;color:var(--m);font-size:11px;letter-spacing:.12em}
nav button{background:none;border:0;text-align:left;padding:10px 12px;border-radius:8px;color:var(--m);cursor:pointer;display:flex;gap:10px;align-items:center;font-weight:500}
nav button:hover{background:var(--p2);color:var(--t)}nav button.on{background:rgba(255,90,0,.12);color:var(--or)}
nav .ic{width:20px;text-align:center}
main{margin-left:220px;padding:22px 26px 90px;max-width:1400px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.top h1{font-size:30px;text-transform:uppercase}.top h1 span{color:var(--or)}
.card{background:var(--p);border:1px solid var(--line);border-radius:12px;padding:16px}
.grid{display:grid;gap:14px}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}
.kpi .v{font-family:'Barlow Condensed';font-size:34px;font-weight:700}.kpi .l{color:var(--m);font-size:12px;text-transform:uppercase;letter-spacing:.08em}
.kpi .s{color:var(--m);font-size:12px;margin-top:2px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{flex:1}
.mt{margin-top:14px}.mb{margin-bottom:14px}.muted{color:var(--m)}.small{font-size:12px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;color:var(--m);text-transform:uppercase;letter-spacing:.07em;font-weight:600;position:sticky;top:0;background:var(--p)}
tr.click{cursor:pointer}tr.click:hover td{background:var(--p2)}
.tw{overflow:auto;max-height:68vh;border:1px solid var(--line);border-radius:12px;background:var(--p)}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:600;background:var(--p2);border:1px solid var(--line);white-space:nowrap}
.pA{color:var(--or);border-color:rgba(255,90,0,.4)}.pB{color:var(--blue)}.pC{color:var(--m)}
.st-New{color:var(--m)}.st-Contacted{color:var(--blue)}.st-Site.Visit,.st-SiteVisit{color:#b98cff}.st-Quoted{color:var(--warn)}.st-Won{color:var(--ok)}.st-Lost{color:var(--bad)}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}
.kan{display:grid;grid-template-columns:repeat(6,minmax(200px,1fr));gap:10px;overflow:auto;padding-bottom:6px}
.col{background:var(--p);border:1px solid var(--line);border-radius:12px;padding:10px;min-height:200px}
.col h3{font-size:15px;text-transform:uppercase;display:flex;justify-content:space-between;margin-bottom:8px}
.kc{background:var(--p2);border:1px solid var(--line);border-radius:9px;padding:9px;margin-bottom:8px;cursor:pointer;font-size:13px}
.kc:hover{border-color:var(--or)}.kc b{display:block}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.day{background:var(--p);border:1px solid var(--line);border-radius:10px;min-height:170px;padding:8px}
.day.today{border-color:var(--or)}.day h4{margin:0 0 6px;font-size:12px;color:var(--m);text-transform:uppercase;letter-spacing:.06em}
.ev{background:rgba(255,90,0,.13);border-left:3px solid var(--or);border-radius:6px;padding:6px;margin-bottom:6px;font-size:12px;cursor:pointer}
.ev.Complete,.ev.Invoiced{background:rgba(46,204,113,.1);border-color:var(--ok)}.ev.Cancelled{opacity:.45}
.ev.visit{background:rgba(77,163,255,.12);border-color:var(--blue)}
.list-item{padding:10px 0;border-bottom:1px solid var(--line)}.list-item:last-child{border:0}
.stars{color:var(--or);letter-spacing:2px}
/* modal */
#ov{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:flex-start;justify-content:center;z-index:50;overflow:auto;padding:30px 12px}
#md{background:var(--p);border:1px solid var(--line);border-radius:14px;width:100%;max-width:720px;padding:20px}
#md h2{font-size:24px;text-transform:uppercase;margin-bottom:6px}
.chk{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--line)}.chk input{width:auto;margin-top:3px}
.chk.done span{color:var(--m);text-decoration:line-through}
.agent{border-left:3px solid var(--or)}
.out{white-space:pre-wrap;background:var(--ink);border:1px solid var(--line);border-radius:8px;padding:12px;font-size:13px;margin-top:10px;min-height:60px}
.bar{height:8px;background:var(--p2);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--or)}
#toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:var(--or);color:#000;padding:10px 16px;border-radius:8px;font-weight:600;display:none;z-index:99}
/* gate */
#gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
#gate .card{max-width:380px;width:100%;text-align:center;padding:30px}
#gate img{width:72px;margin-bottom:10px}
@media(max-width:900px){
 nav{top:auto;bottom:0;right:0;width:auto;height:66px;flex-direction:row;padding:6px;border-right:0;border-top:1px solid var(--line);overflow-x:auto;gap:2px;z-index:40}
 nav .logo,nav .lbl-hide{display:none}
 nav button{flex-direction:column;gap:2px;font-size:10px;padding:6px 8px;min-width:62px;align-items:center}
 main{margin-left:0;padding:16px 12px 90px}
 .g4{grid-template-columns:repeat(2,1fr)}.g3,.g2{grid-template-columns:1fr}
 .week{grid-template-columns:1fr}.day{min-height:auto}
 .hide-m{display:none}
 .top h1{font-size:24px}
}
</style>
</head>
<body>

<div id="gate">
 <div class="card">
  <img src="/img/logo.png" alt="Industry Reset">
  <h2 class="brand" style="font-size:22px">AIGENTS CONTROL ROOM</h2>
  <p class="muted small">Industry Reset operations · authorized crew only</p>
  <input id="pass" type="password" placeholder="Passcode" autocomplete="current-password" onkeydown="if(event.key==='Enter')unlock()">
  <button class="btn mt" style="width:100%" onclick="unlock()">Enter</button>
  <p id="gerr" class="bad small"></p>
 </div>
</div>

<div id="app">
 <nav id="nav"></nav>
 <main id="main"></main>
</div>
<div id="ov" onclick="if(event.target===this)closeM()"><div id="md"></div></div>
<div id="toast"></div>

<script src="leads.js"></script>
<script>
/* ============ CORE ============ */
const KEY='ir_control_room_v1', HQ={lat:39.8376,lon:-75.4513,zip:'19061'};
const DEFAULT_PASS='reset19061';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=p=>p+Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-3);
const today=()=>new Date().toISOString().slice(0,10);
const addDays=(d,n)=>{const x=new Date(d+'T12:00:00');x.setDate(x.getDate()+n);return x.toISOString().slice(0,10)};
const fmt$=n=>'$'+Math.round(+n||0).toLocaleString();
const fdate=d=>d?new Date(d+'T12:00:00').toLocaleDateString(undefined,{month:'short',day:'numeric'}):'—';
function miles(lat,lon){const R=3958.8,r=x=>x*Math.PI/180,dl=r(lat-HQ.lat),dn=r(lon-HQ.lon);const a=Math.sin(dl/2)**2+Math.cos(r(HQ.lat))*Math.cos(r(lat))*Math.sin(dn/2)**2;return Math.round(2*R*Math.asin(Math.sqrt(a)))}
async function sha(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',2200)}

const STAGES=['New','Contacted','Site Visit','Quoted','Won','Lost'];
const SERVICES={
 'BRM Reset':['Check in at gate / safe-work permit signed','Confirm gas test & area clearance with unit ops','PPE: FRC, H2S/4-gas monitor, gloves, eye protection','BEFORE photos — every wall, seat, grille, kitchenette','Dry-steam sanitize walls to ceiling','Desks, counters, consoles (low-moisture near electronics)','Kitchenette: fridge, microwave, sink, cabinets','HVAC grilles & returns cleaned','Heated extraction on chairs & seating','Enzyme odor treatment','Floors scrubbed & dried','AFTER photos (same angles)','Client walkthrough & sign-off'],
 'Shelter / Control Room Reset':['Check in at gate / safe-work permit signed','Coordinate with board operator — no console disruption','PPE: FRC, gas monitor','BEFORE photos','Low-moisture clean on consoles & electronics zones','Heated extraction on chairs & seating','Walls, doors, handles sanitized','HVAC grilles & returns','Enzyme odor treatment','Floors','AFTER photos','Client walkthrough & sign-off'],
 'Blind Exchange':['Count & measure blinds per unit','BEFORE photos','Remove dirty set — tag with site/unit','Install clean set','Log inventory (out / in)','Removed set to cleaning queue','AFTER photos'],
 'Fleet Reset':['Vehicle check-in: unit #, mileage, damage photos','BEFORE photos','Patient compartment / cage disinfection','Seats & headliner extraction','High-touch surfaces sanitized','Odor treatment','AFTER photos','Release to fleet manager with report'],
 'Site Visit / Walk-through':['Meet site contact','Count units, space types, seats','Photos of worst condition','Note access rules, permits, TWIC needs','Note shift / turnaround windows','Confirm decision maker & budget timing']
};

function seed(){
 const leads=(window.IR_SEED_LEADS||[]).map(r=>({id:uid('L'),company:r[0],site:r[1],segment:r[2],city:r[3],st:r[4],lat:r[5],lon:r[6],dist:miles(r[5],r[6]),units:r[7],priority:r[8],website:r[9],status:'New',contact:'',title:'',phone:'',email:'',nextFollow:'',notes:r[10]?[{d:today(),t:r[10]}]:[],created:today()}));
 return {v:1,settings:{passHash:'',biz:'Industry Reset',phone:'484-836-5191',email:'',reviewLink:'',rate:875,plan:'Quarterly',owner:'Tony'},
  leads,jobs:[],quotes:[],invoices:[],reviews:[],
  crew:[{id:uid('C'),name:'Tony Kates',role:'Owner / Lead Tech',phone:'484-836-5191',certs:'OSHA 10, refinery site orientation',twic:'',active:true}],
  equipment:[
   {id:uid('E'),name:'Dry-steam vapor system',status:'To buy',cost:4500,last:'',notes:'Funded by first-quarter deposit'},
   {id:uid('E'),name:'Heated upholstery extractor',status:'To buy',cost:1800,last:'',notes:''},
   {id:uid('E'),name:'HEPA vacuum',status:'To buy',cost:600,last:'',notes:''},
   {id:uid('E'),name:'4-gas / H2S monitor',status:'To buy',cost:700,last:'',notes:'Bump test before every site'},
   {id:uid('E'),name:'Enzyme odor fogger',status:'To buy',cost:350,last:'',notes:''}],
  blinds:{stock:0,atClients:0,cleaning:0},log:[]};
}
let S;
function load(){try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){S=null} if(!S||!S.leads){S=seed();save()}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Storage full — export a backup')}}
const lead=id=>S.leads.find(l=>l.id===id);
const leadName=id=>{const l=lead(id);return l?`${l.company} — ${l.site}`:'(no account)'};

/* ============ GATE ============ */
async function unlock(){
 load();const h=await sha($('#pass').value.trim());
 const want=S.settings.passHash||await sha(DEFAULT_PASS);
 if(h===want){sessionStorage.setItem('ir_ok','1');boot()}else{$('#gerr').textContent='Wrong passcode'}
}
function boot(){load();$('#gate').style.display='none';$('#app').style.display='block';renderNav();go(location.hash.slice(1)||'dash')}
if(sessionStorage.getItem('ir_ok'))boot();

/* ============ NAV ============ */
const VIEWS=[['dash','◉','Dashboard'],['crm','◎','CRM / Leads'],['sched','▦','Schedule'],['jobs','✓','Jobs'],['money','$','Quotes & Invoices'],['reviews','★','Reviews'],['crew','⚙','Crew & Gear'],['agents','✦','AIGents'],['settings','≡','Settings']];
let V='dash',crmMode='table',crmF={q:'',seg:'',st:'',pri:'',r:50},wk=0,jobF='open';
function renderNav(){
 $('#nav').innerHTML=`<div class="logo"><img src="/img/logo.png" alt=""><div><div class="brand" style="font-size:14px">AIGENTS</div><small>CONTROL ROOM</small></div></div>`+
 VIEWS.map(v=>`<button data-v="${v[0]}" onclick="go('${v[0]}')"><span class="ic">${v[1]}</span><span>${v[2].replace('Quotes & Invoices','Money').replace('CRM / Leads','CRM')}</span></button>`).join('');
}
function go(v){if(!VIEWS.find(x=>x[0]===v))v='dash';V=v;location.hash=v;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));render();window.scrollTo(0,0)}
function render(){({dash:vDash,crm:vCrm,sched:vSched,jobs:vJobs,money:vMoney,reviews:vReviews,crew:vCrew,agents:vAgents,settings:vSettings})[V]()}
const hdr=(t,a='')=>`<div class="top"><h1>${t}</h1><div class="row">${a}</div></div>`;
function openM(h){$('#md').innerHTML=h;$('#ov').style.display='flex'}
function closeM(){$('#ov').style.display='none'}
function logA(t){S.log.unshift({d:new Date().toISOString(),t});S.log=S.log.slice(0,100)}

/* ============ DASHBOARD ============ */
function vDash(){
 const open=S.leads.filter(l=>!['Won','Lost'].includes(l.status));
 const pipe=open.reduce((a,l)=>a+(+l.units||0)*S.settings.rate*4,0);
 const won=S.leads.filter(l=>l.status==='Won');
 const arr=won.reduce((a,l)=>a+(+l.units||0)*S.settings.rate*4,0);
 const m=today().slice(0,7);
 const paidM=S.invoices.filter(i=>i.status==='Paid'&&(i.paid||'').startsWith(m)).reduce((a,i)=>a+ +i.amount,0);
 const unpaid=S.invoices.filter(i=>i.status!=='Paid').reduce((a,i)=>a+ +i.amount,0);
 const wkEnd=addDays(today(),7);
 const upcoming=S.jobs.filter(j=>j.date>=today()&&j.date<=wkEnd&&j.status!=='Cancelled').sort((a,b)=>(a.date+a.start).localeCompare(b.date+b.start));
 const due=S.leads.filter(l=>l.nextFollow&&l.nextFollow<=today()&&!['Won','Lost'].includes(l.status));
 const rv=S.reviews.filter(r=>r.rating);const avg=rv.length?(rv.reduce((a,r)=>a+ +r.rating,0)/rv.length).toFixed(1):'—';
 const counts=STAGES.map(s=>[s,S.leads.filter(l=>l.status===s).length]);
 const maxC=Math.max(1,...counts.map(c=>c[1]));
 const hot=S.leads.filter(l=>l.status==='New'&&l.priority==='A').sort((a,b)=>a.dist-b.dist).slice(0,6);
 $('#main').innerHTML=hdr(`<span>AIGents</span> Control Room`,`<button class="btn" onclick="leadForm()">+ Lead</button><button class="btn g" onclick="jobForm()">+ Job</button>`)+`
 <div class="grid g4">
  <div class="card kpi"><div class="l">Open pipeline (annual)</div><div class="v">${fmt$(pipe)}</div><div class="s">${open.length} open leads</div></div>
  <div class="card kpi"><div class="l">Contracted ARR</div><div class="v ok">${fmt$(arr)}</div><div class="s">${won.length} clients · ${won.reduce((a,l)=>a+ +l.units,0)} units</div></div>
  <div class="card kpi"><div class="l">Collected this month</div><div class="v">${fmt$(paidM)}</div><div class="s">${fmt$(unpaid)} outstanding</div></div>
  <div class="card kpi"><div class="l">Avg review</div><div class="v">${avg}<span class="small muted"> ★</span></div><div class="s">${rv.length} reviews · ${S.reviews.filter(r=>!r.rating).length} pending</div></div>
 </div>
 <div class="grid g3 mt">
  <div class="card"><h3>Next 7 days</h3>${upcoming.length?upcoming.map(j=>`<div class="list-item click" onclick="jobView('${j.id}')" style="cursor:pointer"><b>${fdate(j.date)} ${esc(j.start||'')}</b> · ${esc(j.service)}<div class="muted small">${esc(leadName(j.leadId))}</div></div>`).join(''):`<p class="muted">Nothing scheduled. <a href="#" onclick="jobForm();return false">Book a site visit</a>.</p>`}</div>
  <div class="card"><h3>Follow-ups due <span class="${due.length?'warn':'muted'}">(${due.length})</span></h3>${due.length?due.slice(0,8).map(l=>`<div class="list-item" style="cursor:pointer" onclick="leadView('${l.id}')"><b>${esc(l.company)}</b> <span class="muted small">${esc(l.site)}</span><div class="small warn">Due ${fdate(l.nextFollow)} · ${l.status}</div></div>`).join(''):`<p class="muted">You're clear. Set follow-up dates on leads to drive this list.</p>`}</div>
  <div class="card"><h3>Pipeline by stage</h3>${counts.map(([s,c])=>`<div class="mt" style="margin-top:9px"><div class="row small"><span>${s}</span><span class="sp"></span><b>${c}</b></div><div class="bar"><i style="width:${c/maxC*100}%;${s==='Won'?'background:var(--ok)':s==='Lost'?'background:var(--bad)':''}"></i></div></div>`).join('')}</div>
 </div>
 <div class="grid g2 mt">
  <div class="card"><h3>Hit list — closest A-priority, not yet contacted</h3>${hot.map(l=>`<div class="list-item row" style="cursor:pointer" onclick="leadView('${l.id}')"><div class="sp"><b>${esc(l.company)}</b><div class="muted small">${esc(l.site)} · ${esc(l.segment)}</div></div><span class="pill">${l.dist} mi</span></div>`).join('')||'<p class="muted">All A-leads touched. 🔥</p>'}</div>
  <div class="card"><h3>Activity</h3>${S.log.slice(0,8).map(a=>`<div class="list-item small"><span class="muted">${new Date(a.d).toLocaleString(undefined,{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}</span> — ${esc(a.t)}</div>`).join('')||'<p class="muted">No activity yet.</p>'}</div>
 </div>`;
}

/* ============ CRM ============ */
function filtered(){const q=crmF.q.toLowerCase();return S.leads.filter(l=>(!q||[l.company,l.site,l.city,l.contact,l.segment].join(' ').toLowerCase().includes(q))&&(!crmF.seg||l.segment===crmF.seg)&&(!crmF.st||l.status===crmF.st)&&(!crmF.pri||l.priority===crmF.pri)&&(!crmF.r||l.dist<=crmF.r)).sort((a,b)=>(a.priority+String(a.dist).padStart(3,'0')).localeCompare(b.priority+String(b.dist).padStart(3,'0')))}
function vCrm(){
 const segs=[...new Set(S.leads.map(l=>l.segment))].sort();
 const L=filtered();
 $('#main').innerHTML=hdr('CRM <span>/ Leads</span>',`<button class="btn g s" onclick="crmMode=crmMode==='table'?'kan':'table';vCrm()">${crmMode==='table'?'Pipeline view':'Table view'}</button><button class="btn g s" onclick="exportCSV()">Export CSV</button><button class="btn" onclick="leadForm()">+ Lead</button>`)+`
 <div class="card mb"><div class="row">
  <input style="max-width:260px" placeholder="Search company, site, city…" value="${esc(crmF.q)}" oninput="crmF.q=this.value;clearTimeout(window._qt);window._qt=setTimeout(()=>{vCrm();const i=document.querySelector('#main input');i.focus();i.setSelectionRange(99,99)},250)">
  <select style="max-width:200px" onchange="crmF.seg=this.value;vCrm()"><option value="">All segments</option>${segs.map(s=>`<option ${crmF.seg===s?'selected':''}>${esc(s)}</option>`).join('')}</select>
  <select style="max-width:150px" onchange="crmF.st=this.value;vCrm()"><option value="">All stages</option>${STAGES.map(s=>`<option ${crmF.st===s?'selected':''}>${s}</option>`).join('')}</select>
  <select style="max-width:120px" onchange="crmF.pri=this.value;vCrm()"><option value="">Any priority</option>${['A','B','C'].map(s=>`<option ${crmF.pri===s?'selected':''}>${s}</option>`).join('')}</select>

const AGENTS=[
 ['outreach','Outreach Writer','Writes a first-touch email for any lead, tuned to its segment.',true],
 ['followup','Follow-up Nudger','Drafts the next touch for every overdue follow-up.',false],
 ['review','Review Requester','Text + email asking a happy client for a Google review.',true],
 ['report','Job Report Writer','Turns a job checklist + notes into a client-ready visit report.',false],

function vAgents(){
 $('#main').innerHTML=hdr('<span>AIGents</span>','')+`<p class="muted mb">Agents read live Control Room data and draft the work. You review, copy, send. No API keys or customer data leave this device.</p>
 <div class="grid g3">${AGENTS.map(a=>`<div class="card agent"><h3>${a[1]}</h3><p class="muted small">${a[2]}</p>${a[3]?`<select id="ag_${a[0]}" class="mt"><option value="">Pick a lead…</option>${S.leads.slice().sort((x,y)=>x.company.localeCompare(y.company)).map(l=>`<option value="${l.id}">${esc(l.company)} — ${esc(l.site)}</option>`).join('')}</select>`:''}<button class="btn mt" onclick="agentRun('${a[0]}',${a[3]?`$('#ag_${a[0]}').value`:'null'})">Run</button></div>`).join('')}</div>`;

function segAngle(l){const s=l.segment;
 if(/Refinery|Terminal|Chemical/.test(s))return'Your operators eat, work and rest in the same steel box shift after shift — janitorial wipe-downs never reach the seat foam, the HVAC grilles or the smell. That is exactly what we reset.';
 if(/Power|Utility/.test(s))return'Control rooms and outage trailers run 24/7 and it shows — seat foam, HVAC returns and odor that a nightly wipe-down never touches. We use low-moisture methods that are safe around consoles.';
 if(/Rental|Modular/.test(s))return'Every BRM that comes back from a turnaround needs to go out again looking — and smelling — new. We can reset units between deployments so your next customer gets a clean box on day one.';
 if(/Contractor/.test(s))return'Your crews live in rented BRMs during turnarounds. We reset them mid-job and before demob, so you hand the unit back clean and your people work in a space that doesn\'t smell like week three.';
 if(/Fleet/.test(s))return'Patrol cars and ambulances need more than a detail — cages, patient compartments, seats and headliners hold odor and contamination. We reset them, documented with before-and-after photos.';
 if(/Port|Marine|Manufacturing|Redevelopment/.test(s))return'Gate houses, crew trailers and break shelters take a beating around the clock. We deep-clean and deodorize them on your schedule, with a photo report every visit.';
 return'We deep-clean and odor-reset the spaces your people live in around the clock — with a photo report every visit.'}
function agentRun(type,leadId,jobId){
 const s=S.settings,l=lead(leadId),j=jobId?S.jobs.find(x=>x.id===jobId):null;let title='',out='',actions='';
 if((type==='outreach'||type==='review')&&!l&&!j)return toast('Pick a lead first');
 if(type==='outreach'){title='Outreach — '+l.company;
  out=`Subject: Shelter & BRM deep cleaning for ${l.company} — from an operator\n\nHi ${l.contact?l.contact.split(' ')[0]:'there'},\n\nI'm ${s.owner}, founder of Industry Reset — and a refinery shift worker myself, based in Upper Chichester${l.dist&&l.dist<=5?', a few minutes from your site':l.dist?', about '+l.dist+' miles from your site':', in the middle of the Delaware Valley refinery corridor'}.\n\n${segAngle(l)}\n\nWhat a Reset includes:\n• Dry-steam sanitizing, walls to ceiling\n• Heated extraction on chairs and seating\n• HVAC grilles and returns, enzyme odor treatment\n• Photo report every visit, scheduled around shifts and turnarounds\n\nPricing is simple: ${fmt$(s.rate)} per unit, per quarter${(l.units||0)>=10?', with volume pricing for 10+ units':''}. Start with one quarter — cancel anytime after.\n\nCould I do a 20-minute walk-through of ${l.units?'a few of your '+l.units+' estimated units':'one of your units'} next week?\n\n${s.owner}\nIndustry Reset · ${s.phone}\nindustryreset.com`;
  actions=`${l.email?`<a class="btn s" href="mailto:${esc(l.email)}?subject=${encodeURIComponent(out.split('\n')[0].replace('Subject: ',''))}&body=${encodeURIComponent(out.split('\n').slice(2).join('\n'))}">Open in email</a>`:'<span class="muted small">Add an email on the lead to send directly.</span>'}<button class="btn g s" onclick="const l=lead('${l.id}');l.notes.unshift({d:today(),t:'Outreach email sent'});setStage(l,'Contacted');l.nextFollow=addDays(today(),4);save();toast('Logged — follow-up in 4 days');render()">Mark sent</button>`}
 if(type==='followup'){title='Follow-ups due';const due=S.leads.filter(x=>x.nextFollow&&x.nextFollow<=today()&&!['Won','Lost'].includes(x.status));
  out=due.length?due.map(x=>`— ${x.company} (${x.status}, due ${fdate(x.nextFollow)})\n${x.status==='Quoted'?`Hi ${x.contact||'there'}, checking in on the Reset quote for ${x.site}. Happy to adjust scope or start with a smaller set of units this quarter. Want me to hold a date?`:x.status==='Site Visit'?`Hi ${x.contact||'there'}, thanks for the walk-through at ${x.site}. I'm putting the quote together now — anything you want included, like the blind exchange or control rooms?`:`Hi ${x.contact||'there'}, following up on my note about resetting the shelters at ${x.site}. Is there a better person for me to talk to about site services?`}\n— ${s.owner}, Industry Reset ${s.phone}`).join('\n\n'):'Nothing due today. Set follow-up dates on leads (CRM → open a lead) and they show up here.'}
 if(type==='review'){const L=l||lead(j?.leadId);title='Review request — '+(L?.company||'');
  out=`TEXT:\nHi ${L?.contact?L.contact.split(' ')[0]:'there'}, ${s.owner} from Industry Reset. Thanks for having us out at ${L?.company||'your site'}. If your crew noticed the difference, would you leave us a quick Google review? It helps a small operator-run business a lot: ${s.reviewLink||'[add review link in Settings]'}\n\nEMAIL:\nSubject: Quick favor — how did the Reset go?\n\nHi ${L?.contact?L.contact.split(' ')[0]:'there'},\n\nThanks again for trusting us with your units at ${L?.company||'your site'}. If the operators noticed the difference, a short Google review would mean a lot: ${s.reviewLink||'[review link]'}\n\nIf anything wasn't right, reply here and I'll make it right on the next visit.\n\n${s.owner}\nIndustry Reset · ${s.phone}`;
  actions=L?.phone?`<a class="btn s" href="sms:${esc(L.phone)}?&body=${encodeURIComponent(out.split('\n\nEMAIL:')[0].replace('TEXT:\n',''))}">Open in Messages</a>`:''}
 if(type==='report'){if(!j)return toast('Open a job first');const L=lead(j.leadId);title='Visit report — '+(L?.company||'');
  out=`INDUSTRY RESET — VISIT REPORT\n${L?.company||''} · ${L?.site||''}\nDate: ${fdate(j.date)} · Service: ${j.service} · Units: ${j.units}\n\nWORK COMPLETED\n${j.checklist.filter(c=>c.done).map(c=>'✔ '+c.t).join('\n')||'(check off the job checklist first)'}\n${j.checklist.some(c=>!c.done)?'\nNOT COMPLETED / DEFERRED\n'+j.checklist.filter(c=>!c.done).map(c=>'• '+c.t).join('\n')+'\n':''}\nTECHNICIAN NOTES\n${j.report||j.notes||'—'}\n\nNEXT VISIT\nRecommended: ${fdate(addDays(j.date,91))} (quarterly program)\n\nBefore/after photos attached.\n${s.owner} · ${s.phone}`;
  actions=`<button class="btn g s" onclick="const j=S.jobs.find(x=>x.id==='${j.id}');j.report=$('#agout').innerText;save();toast('Saved to job')">Save to job</button>`}
 if(type==='brief'){title='Weekly brief';const open=S.leads.filter(x=>!['Won','Lost'].includes(x.status));const wkJ=S.jobs.filter(x=>x.date>=today()&&x.date<=addDays(today(),7));const unp=S.invoices.filter(i=>i.status!=='Paid');
  const moves=[];const nc=S.leads.filter(x=>x.status==='New'&&x.priority==='A').sort((a,b)=>a.dist-b.dist);if(nc[0])moves.push(`Contact ${nc[0].company} (${nc[0].site}, ${nc[0].dist} mi) — closest untouched A-lead.`);
  const dq=S.leads.filter(x=>x.nextFollow&&x.nextFollow<=today()&&!['Won','Lost'].includes(x.status));if(dq.length)moves.push(`Clear ${dq.length} overdue follow-up(s) — run Follow-up Nudger.`);
  const qd=S.quotes.filter(q=>q.status==='Sent');if(qd.length)moves.push(`Chase ${qd.length} open quote(s) worth ${fmt$(qd.reduce((a,q)=>a+qTotal(q)*4,0))}/yr.`);
  if(unp.length)moves.push(`Collect ${fmt$(unp.reduce((a,i)=>a+ +i.amount,0))} outstanding.`);
  const nr=S.jobs.filter(x=>['Complete','Invoiced'].includes(x.status)&&!S.reviews.find(r=>r.jobId===x.id));if(nr.length)moves.push(`Request ${nr.length} review(s) from completed jobs.`);
  if(!S.leads.some(x=>x.status==='Won'))moves.push('Land client #1: one quarter upfront funds the equipment. Focus on the ≤5-mile A-leads.');
  out=`INDUSTRY RESET — WEEKLY BRIEF (${fdate(today())})\n\nPIPELINE\n${STAGES.map(st=>`${st}: ${S.leads.filter(x=>x.status===st).length}`).join(' · ')}\nOpen annual value: ${fmt$(open.reduce((a,x)=>a+x.units*s.rate*4,0))}\n\nTHIS WEEK\n${wkJ.length} jobs scheduled${wkJ.length?':\n'+wkJ.map(x=>`• ${fdate(x.date)} ${x.service} — ${lead(x.leadId)?.company||''}`).join('\n'):''}\n\nCASH\nOutstanding: ${fmt$(unp.reduce((a,i)=>a+ +i.amount,0))} · Paid this month: ${fmt$(S.invoices.filter(i=>i.status==='Paid'&&(i.paid||'').startsWith(today().slice(0,7))).reduce((a,i)=>a+ +i.amount,0))}\n\nTOP MOVES\n${moves.slice(0,5).map((m,i)=>`${i+1}. ${m}`).join('\n')}`}
 if(type==='route'){title='Route planner';const open=S.leads.filter(x=>['New','Contacted'].includes(x.status));const zones={};
  open.forEach(x=>{const z=x.st==='NJ'?'South Jersey river corridor':x.st==='DE'?(x.lat<39.65?'Delaware City / south':'Wilmington / New Castle'):x.dist<=8?'Home base: Marcus Hook / Chester / Trainer':x.lat>39.98?'North: Philly NE / Montco / Bucks':'Philadelphia south / airport';(zones[z]=zones[z]||[]).push(x)});
  out=Object.entries(zones).sort((a,b)=>b[1].length-a[1].length).map(([z,ls])=>`${z.toUpperCase()} (${ls.length})\n${ls.sort((a,b)=>a.priority.localeCompare(b.priority)).map(x=>`  [${x.priority}] ${x.company} — ${x.site} (${x.dist} mi)`).join('\n')}`).join('\n\n')+'\n\nBlock one off-rotation day per zone and stack 3–4 drop-ins or walk-throughs.'}
 openM(`<div class="row"><h2 class="sp">✦ ${esc(title)}</h2><button class="btn g s" onclick="closeM()">✕</button></div><div class="out" id="agout" contenteditable="true">${esc(out)}</div>
 <div class="row mt"><button class="btn s" onclick="navigator.clipboard.writeText($('#agout').innerText);toast('Copied')">Copy</button>${actions}</div><p class="muted small mt">Editable — tweak before you send.</p>`);
}

/* ============ SETTINGS ============ */
function vSettings(){const s=S.settings;
 $('#main').innerHTML=hdr('Settings','')+`<div class="grid g2"><div class="card"><h3>Business</h3>
 ${[['owner','Your name'],['phone','Business phone'],['email','Business email'],['reviewLink','Google review link']].map(([k,t])=>`<label>${t}</label><input id="s_${k}" value="${esc(s[k])}" ${k==='reviewLink'?'placeholder="https://g.page/r/…/review"':''}>`).join('')}
 <label>Rate per unit, per quarter</label><input id="s_rate" type="number" value="${s.rate}">
 <button class="btn mt" onclick="['owner','phone','email','reviewLink'].forEach(k=>S.settings[k]=$('#s_'+k).value.trim());S.settings.rate=+$('#s_rate').value||875;save();toast('Saved')">Save</button></div>
 <div class="card"><h3>Security</h3><label>New passcode</label><input id="s_pass" type="password"><button class="btn g mt" onclick="setPass()">Change passcode</button>
 <p class="muted small">Passcode is per device. Data lives in this browser — export a backup weekly.</p>
 <h3 class="mt">Data</h3><div class="row mt"><button class="btn g" onclick="dl('control-room-backup-'+today()+'.json',JSON.stringify(S),'application/json')">Export backup</button><label class="btn g" style="margin:0;text-transform:none;font-size:15px;letter-spacing:0;color:var(--t)">Import backup<input type="file" accept=".json" style="display:none" onchange="importB(this.files[0])"></label></div>
 <div class="row mt"><button class="btn g s" onclick="mergeSeed()">Re-add missing seed leads</button><button class="btn d s" onclick="if(confirm('Erase ALL Control Room data on this device?')){localStorage.removeItem(KEY);load();toast('Reset');go('dash')}">Factory reset</button><button class="btn g s" onclick="sessionStorage.clear();location.reload()">Lock</button></div></div></div>`}
async function setPass(){const v=$('#s_pass').value.trim();if(v.length<6)return toast('Min 6 characters');S.settings.passHash=await sha(v);save();toast('Passcode changed')}
function importB(f){const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.leads)throw 0;S=d;save();toast('Backup restored');go('dash')}catch(e){toast('Not a valid backup')}};r.readAsText(f)}
function mergeSeed(){const have=new Set(S.leads.map(l=>l.company+'|'+l.site));const add=seed().leads.filter(l=>!have.has(l.company+'|'+l.site));S.leads.push(...add);save();toast(add.length+' leads added')}
</script>
